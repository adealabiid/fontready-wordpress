name: WordPress directory checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './fontready'
          slug: fontready
          wp-version: '7.1.3'
          strict: true
